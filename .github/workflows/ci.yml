name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.0', cache: true}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.0'}
      - run: make bootstrap
      - run: cd e2e && bunx playwright install --with-deps chromium
      - run: make check
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: playwright-failures, path: e2e/artifacts}
      - run: make build
      - uses: actions/upload-artifact@v4
        with: {name: bean, path: bin/bean}
