kind: Panel
name: frame_opening
layout: single-column
regions:
  - name: main
    items:
      - id: title
        content:
          - {type: heading, text: "Bean: from intent to operating software"}
          - {type: paragraph, text: "Describe the application once, then let people and agents operate the same validated semantics."}
---
kind: Panel
name: frame_product
layout: single-column
regions:
  - {name: main, blocks: [product_statement]}
---
kind: Panel
name: frame_architecture
layout: single-column
regions:
  - name: main
    items:
      - content:
          - {type: diagram, direction: horizontal, items: [Definition, Validation, Migration, Immutable AppIR, Atomic activation]}
          - {type: paragraph, text: "Every change crosses the same reviewable path before it becomes live."}
---
kind: Panel
name: frame_primitives
layout: single-column
regions:
  - name: main
    items:
      - content:
          - {type: bullets, items: ["Entity gives data a durable shape", "View and Display own typed reads", "Page and Panel compose the experience", "Action owns mutations and effects", "Policy, Rule, and Lifecycle enforce boundaries"]}
---
kind: Panel
name: frame_agent
layout: single-column
regions:
  - name: main
    items:
      - content:
          - {type: diagram, direction: horizontal, items: [Intent, Definitions, Validate, Inspect and diff, Test, Publish]}
          - {type: callout, tone: success, text: "Agent output remains inspectable, repairable, testable, versioned, and manually editable."}
---
kind: Panel
name: frame_explore
layout: single-column
regions:
  - name: main
    items:
      - content:
          - {type: diagram, direction: horizontal, items: [Observe, Filter, Visualize, Drill down, Act]}
          - {type: paragraph, text: "Explore moves from a signal to an authorized Action without creating a second query or mutation path."}
---
kind: Panel
name: frame_capabilities
layout: single-column
regions:
  - name: main
    items:
      - content:
          - {type: paragraph, text: "This is live application data: a grouped View rendered by its declared chart Display inside the slide."}
      - block: capability_chart
---
kind: Panel
name: frame_safety
layout: two-column
regions:
  - name: left
    items:
      - id: application_boundary
        content:
          - {type: heading, text: "Bean owns application meaning"}
          - {type: bullets, items: ["Typed definitions and deterministic diagnostics", "Policy before every read and aggregate", "Lifecycle and Rules constrain Actions", "Atomic release activation"]}
  - name: right
    items:
      - id: provider_boundary
        content:
          - {type: heading, text: "Providers own infrastructure"}
          - {type: bullets, items: ["Storage adapters", "Typed Extensions for external effects", "Explicit transport boundaries", "No opaque application scripts"]}
---
kind: Panel
name: frame_examples
layout: two-column
regions:
  - name: left
    items:
      - content:
          - {type: heading, text: "Examples prove behavior"}
          - {type: bullets, items: ["ATS: recruiting operations", "SaaS: provisioned team workspaces", "Commerce: observe, inspect, act", "Books: contextual records and navigation"]}
  - name: right
    items:
      - content:
          - {type: heading, text: "One runtime, many product shapes"}
          - {type: bullets, items: ["Operate structured workflows", "Explore live data", "Compose contextual workspaces", "Present a guided narrative"]}
---
kind: Panel
name: frame_close
layout: single-column
regions:
  - name: main
    items:
      - content:
          - {type: heading, text: "Start with one useful workflow"}
          - {type: paragraph, text: "Model its Entity, route reads through Views, route writes through Actions, then publish the validated bundle."}
          - {type: callout, tone: success, text: "bean demo run presentation"}
