apiVersion: bean/v1alpha1
name: Applicant Tracker
---
kind: Theme
name: default
displayName: Acme Recruiting
preset: professional
accent: indigo
---
kind: Policy
name: public_access
---
kind: Entity
name: job
label: Job
policy: public_access
fields:
  - {name: title, label: Title, type: string, required: true}
  - {name: department, label: Department, type: string, required: true}
  - {name: location, label: Location, type: string}
---
kind: Entity
name: candidate
label: Candidate
policy: public_access
fields:
  - {name: job_id, label: Job, type: relation, required: true, relation: {entity: job, kind: many-to-one, targetField: id}}
  - {name: name, label: Name, type: string, required: true}
  - {name: email, label: Email, type: email, required: true, unique: true}
  - {name: stage, label: Stage, type: enum, required: true, options: [applied, screen, interview, offer, hired, rejected]}
  - {name: applied_at, label: Applied, type: datetime, required: true}
  - {name: summary, label: Summary, type: text}
---
kind: Entity
name: note
label: Note
policy: public_access
fields:
  - {name: candidate_id, label: Candidate, type: relation, required: true, relation: {entity: candidate, kind: many-to-one, targetField: id}}
  - {name: body, label: Body, type: text, required: true}
---
kind: Entity
name: activity
label: Activity
policy: public_access
fields:
  - {name: candidate_id, label: Candidate, type: relation, required: true, relation: {entity: candidate, kind: many-to-one, targetField: id}}
  - {name: subject, label: Subject, type: string, required: true}
  - {name: detail, label: Detail, type: text}
  - {name: occurred_at, label: Occurred, type: datetime, required: true}
---
kind: Lifecycle
name: candidate_pipeline
entity: candidate
stateField: stage
initial: applied
transitions:
  applied: [screen, rejected]
  screen: [interview, rejected]
  interview: [offer, rejected]
  offer: [hired, rejected]
---
kind: Action
name: move_candidate
entity: candidate
operation: transition
policy: public_access
lifecycle: candidate_pipeline
when: candidate_is_named
---
kind: Rule
name: candidate_is_named
entity: candidate
result: boolean
expression:
  op: ne
  args:
    - op: trim
      args:
        - {source: this, path: name}
    - {source: literal, literal: ""}
---
kind: TestSuite
name: candidate_move_contract
target: {kind: Action, name: move_candidate}
tests:
  - name: named_candidate_moves
    fixtures:
      job:
        - {id: 00000000-0000-4000-8000-000000000201, title: Engineer, department: Product}
      candidate:
        - {id: 00000000-0000-4000-8000-000000000202, job_id: 00000000-0000-4000-8000-000000000201, name: Ada, email: ada@example.test, stage: applied, applied_at: 2026-09-01T09:00:00Z}
    context: {time: "2026-09-01T10:00:00Z", requestId: ats-test}
    input: {id: 00000000-0000-4000-8000-000000000202, stage: screen}
    expect:
      result: {id: 00000000-0000-4000-8000-000000000202, stage: screen}
      changes:
        - {entity: candidate, id: 00000000-0000-4000-8000-000000000202, values: {stage: screen, version: 2}}
      noEvents: true
  - name: unnamed_candidate_is_denied
    fixtures:
      job:
        - {id: 00000000-0000-4000-8000-000000000201, title: Engineer, department: Product}
      candidate:
        - {id: 00000000-0000-4000-8000-000000000202, job_id: 00000000-0000-4000-8000-000000000201, name: "", email: ada@example.test, stage: applied, applied_at: 2026-09-01T09:00:00Z}
    context: {time: "2026-09-01T10:00:00Z", requestId: ats-test}
    input: {id: 00000000-0000-4000-8000-000000000202, stage: screen}
    expect: {error: conflict, noChanges: true, noEvents: true}
---
kind: View
name: candidate_pipeline
entity: candidate
policy: public_access
fields: [id, job_id, name, email, stage, applied_at, summary]
exposedFilters:
  stage: {field: stage, operator: eq}
displays:
  search:
    type: block
    renderer: {type: list, titleField: name, bodyField: summary, metaFields: [email, stage, applied_at], searchFields: [name, email, summary], linkRoute: /candidates/:id, linkField: id}
    pager: {type: cursor, pageSize: 50}
    emptyState: No candidates match this search.
  board:
    type: block
    renderer: {type: board, titleField: name, groupField: stage, columns: [applied, screen, interview, offer, hired, rejected], moveAction: move_candidate, metaFields: [email, applied_at], linkRoute: /candidates/:id, linkField: id}
    pager: {type: none, pageSize: 50}
  table:
    type: block
    selection: multiple
    actions: [move_candidate]
    title: {text: Candidates}
    description: Filter and review the candidate pipeline.
    renderer:
      type: table
      fields:
        - {field: name, label: Candidate, linkRoute: /candidates/:id}
        - {field: email, label: Email}
        - {field: stage, label: Stage}
        - {field: applied_at, label: Applied}
    controls:
      - {filter: stage, label: Pipeline stage, widget: select}
    pager: {type: cursor, pageSize: 10}
    emptyState: No candidates match.
sort:
  - {field: applied_at, desc: true}
---
kind: View
name: candidate_records
entity: candidate
policy: public_access
relationships:
  - {name: job, relationField: job_id, type: inner}
fields: [id, job_id, job.title, job.department, name, email, stage, applied_at, summary]
search: {fields: [name, email, summary]}
exposedFilters:
  job: {field: job_id, operator: eq}
  job_title: {field: job.title, operator: eq}
  department: {field: job.department, operator: eq}
  stage: {field: stage, operator: eq}
  applied_from: {field: applied_at, operator: gte}
  applied_to: {field: applied_at, operator: lte}
displays:
  list:
    type: block
    renderer: {type: list, titleField: name, bodyField: summary, metaFields: [email, stage, applied_at], linkRoute: /candidates/:id, linkField: id}
    pager: {type: cursor, pageSize: 25}
    emptyState: No candidates match.
  cards:
    type: block
    renderer: {type: cards, titleField: name, bodyField: summary, metaFields: [job.title, job.department, email, stage, applied_at], linkRoute: /candidates/:id, linkField: id}
    pager: {type: cursor, pageSize: 25}
    emptyState: No candidates match.
  board:
    type: block
    renderer: {type: board, titleField: name, groupField: stage, columns: [applied, screen, interview, offer, hired, rejected], moveAction: move_candidate, metaFields: [job.title, email, applied_at], linkRoute: /candidates/:id, linkField: id}
    pager: {type: none, pageSize: 200}
  table:
    type: block
    selection: multiple
    actions: [move_candidate]
    renderer:
      type: table
      fields:
        - {field: name, label: Candidate, linkRoute: /candidates/:id}
        - {field: job.title, label: Job}
        - {field: job.department, label: Department}
        - {field: stage, label: Stage}
        - {field: applied_at, label: Applied}
    pager: {type: cursor, pageSize: 25}
    emptyState: No candidates match.
  page:
    type: page
    selection: multiple
    actions: [move_candidate]
    route: /candidates
    title: {text: Candidates}
    description: Inspect the records contributing to recruiting metrics.
    renderer:
      type: table
      fields:
        - {field: name, label: Candidate, linkRoute: /candidates/:id}
        - {field: job.title, label: Job}
        - {field: job.department, label: Department}
        - {field: stage, label: Stage}
        - {field: applied_at, label: Applied}
    controls:
      - {filter: job, label: Job, widget: auto}
      - {filter: job_title, label: Job title, widget: text}
      - {filter: department, label: Department, widget: text}
      - {filter: stage, label: Stage, widget: select}
      - {filter: applied_from, label: Applied from, widget: date}
      - {filter: applied_to, label: Applied to, widget: date}
    pager: {type: cursor, pageSize: 25}
    emptyState: No candidates contribute to this result.
sort:
  - {field: applied_at, desc: true}
---
kind: View
name: candidate_detail
entity: candidate
policy: public_access
fields: [id, job_id, name, email, stage, applied_at, summary]
exposedFilters:
  id: {field: id, operator: eq}
displays:
  summary:
    type: block
    title: {field: name, fallback: Candidate}
    renderer: {type: detail, titleField: name, bodyField: summary, metaFields: [email, stage, applied_at]}
    pager: {type: none, pageSize: 50}
---
kind: View
name: candidate_total
entity: candidate
policy: public_access
aggregates:
  - {function: count, field: id, alias: candidate_count}
displays:
  metric:
    type: block
    renderer: {type: metric, metricField: candidate_count, metricLabel: Active candidates}
    pager: {type: none, pageSize: 50}
---
kind: View
name: active_candidate_total
entity: candidate
policy: public_access
relationships:
  - {name: job, relationField: job_id, type: inner}
exposedFilters:
  job: {field: job_id, operator: eq}
  department: {field: job.department, operator: eq}
  stage: {field: stage, operator: eq}
  applied_from: {field: applied_at, operator: gte}
  applied_to: {field: applied_at, operator: lte}
filter:
  op: not_in
  left: {source: record, name: stage}
  right: {source: literal, literal: [hired, rejected]}
aggregates:
  - {function: count, field: id, alias: candidate_count}
displays:
  metric:
    type: block
    renderer: {type: metric, metricField: candidate_count, metricLabel: Active candidates}
    pager: {type: none, pageSize: 1}
    drill:
      view: active_candidate_records
      display: page
      bindings:
        - {source: filter, name: job, filter: job}
        - {source: filter, name: department, filter: department}
        - {source: filter, name: stage, filter: stage}
        - {source: filter, name: applied_from, filter: applied_from}
        - {source: filter, name: applied_to, filter: applied_to}
---
kind: View
name: active_candidate_records
entity: candidate
policy: public_access
relationships:
  - {name: job, relationField: job_id, type: inner}
fields: [id, job_id, job.title, job.department, name, email, stage, applied_at]
exposedFilters:
  job: {field: job_id, operator: eq}
  department: {field: job.department, operator: eq}
  stage: {field: stage, operator: eq}
  applied_from: {field: applied_at, operator: gte}
  applied_to: {field: applied_at, operator: lte}
filter:
  op: not_in
  left: {source: record, name: stage}
  right: {source: literal, literal: [hired, rejected]}
sort:
  - {field: applied_at, desc: true}
displays:
  page:
    type: page
    route: /active-candidates
    title: {text: Active candidates}
    renderer:
      type: table
      fields:
        - {field: name, label: Candidate, linkRoute: /candidates/:id}
        - {field: job.title, label: Job}
        - {field: job.department, label: Department}
        - {field: stage, label: Stage}
        - {field: applied_at, label: Applied}
    controls:
      - {filter: job, label: Job, widget: auto}
      - {filter: department, label: Department, widget: text}
      - {filter: stage, label: Stage, widget: select}
      - {filter: applied_from, label: Applied from, widget: date}
      - {filter: applied_to, label: Applied to, widget: date}
    pager: {type: cursor, pageSize: 25}
---
kind: View
name: candidates_by_stage
entity: candidate
policy: public_access
relationships:
  - {name: job, relationField: job_id, type: inner}
exposedFilters:
  job: {field: job_id, operator: eq}
  department: {field: job.department, operator: eq}
  stage: {field: stage, operator: eq}
  applied_from: {field: applied_at, operator: gte}
  applied_to: {field: applied_at, operator: lte}
fields: [stage]
groupBy:
  - {field: stage}
aggregates:
  - {function: count, field: id, alias: candidate_count}
displays:
  table:
    type: block
    renderer:
      type: table
      fields:
        - {field: stage, label: Stage}
        - {field: candidate_count, label: Candidates}
    pager: {type: none, pageSize: 200}
  chart:
    type: block
    renderer: {type: chart, groupField: stage, metricField: candidate_count, metricLabel: Candidates by stage}
    pager: {type: none, pageSize: 200}
    drill:
      view: candidate_records
      display: page
      bindings:
        - {source: group, name: stage, filter: stage}
        - {source: filter, name: job, filter: job}
        - {source: filter, name: department, filter: department}
        - {source: filter, name: applied_from, filter: applied_from}
        - {source: filter, name: applied_to, filter: applied_to}
---
kind: View
name: candidates_by_job
entity: candidate
policy: public_access
relationships:
  - {name: job, relationField: job_id, type: inner}
fields: [job.title]
exposedFilters:
  job: {field: job_id, operator: eq}
  department: {field: job.department, operator: eq}
  stage: {field: stage, operator: eq}
  applied_from: {field: applied_at, operator: gte}
  applied_to: {field: applied_at, operator: lte}
groupBy:
  - {field: job.title, as: job}
aggregates:
  - {function: count, field: id, alias: candidate_count}
displays:
  chart:
    type: block
    renderer: {type: chart, groupField: job, metricField: candidate_count, metricLabel: Candidates by job}
    pager: {type: none, pageSize: 200}
    drill:
      view: candidate_records
      display: page
      bindings:
        - {source: group, name: job, filter: job_title}
        - {source: filter, name: department, filter: department}
        - {source: filter, name: stage, filter: stage}
        - {source: filter, name: applied_from, filter: applied_from}
        - {source: filter, name: applied_to, filter: applied_to}
---
kind: View
name: candidates_by_department
entity: candidate
policy: public_access
relationships:
  - {name: job, relationField: job_id, type: inner}
fields: [job.department]
exposedFilters:
  job: {field: job_id, operator: eq}
  department: {field: job.department, operator: eq}
  stage: {field: stage, operator: eq}
  applied_from: {field: applied_at, operator: gte}
  applied_to: {field: applied_at, operator: lte}
groupBy:
  - {field: job.department, as: department}
aggregates:
  - {function: count, field: id, alias: candidate_count}
displays:
  chart:
    type: block
    renderer: {type: chart, groupField: department, metricField: candidate_count, metricLabel: Candidates by department}
    pager: {type: none, pageSize: 200}
    drill:
      view: candidate_records
      display: page
      bindings:
        - {source: group, name: department, filter: department}
        - {source: filter, name: job, filter: job}
        - {source: filter, name: stage, filter: stage}
        - {source: filter, name: applied_from, filter: applied_from}
        - {source: filter, name: applied_to, filter: applied_to}
---
kind: View
name: recent_candidates
entity: candidate
policy: public_access
relationships:
  - {name: job, relationField: job_id, type: inner}
fields: [id, job_id, name, email, stage, applied_at]
exposedFilters:
  job: {field: job_id, operator: eq}
  department: {field: job.department, operator: eq}
  stage: {field: stage, operator: eq}
  applied_from: {field: applied_at, operator: gte}
  applied_to: {field: applied_at, operator: lte}
displays:
  list:
    type: block
    renderer: {type: list, titleField: name, metaFields: [email, stage, applied_at], linkRoute: /candidates/:id, linkField: id}
    pager: {type: none, pageSize: 10}
sort:
  - {field: applied_at, desc: true}
defaultLimit: 10
maxLimit: 10
---
kind: View
name: recent_activity
entity: activity
policy: public_access
fields: [id, candidate_id, subject, detail, occurred_at]
displays:
  timeline:
    type: block
    renderer: {type: timeline, titleField: subject, bodyField: detail, timeField: occurred_at}
    pager: {type: cursor, pageSize: 50}
sort:
  - {field: occurred_at, desc: true}
---
kind: Block
name: candidate_metric
type: view
view: active_candidate_total
display: metric
---
kind: Block
name: candidate_search
type: view
view: candidate_records
display: list
---
kind: Block
name: candidate_board
type: view
view: candidate_records
display: board
---
kind: Block
name: candidate_stage_chart
type: view
view: candidates_by_stage
display: chart
---
kind: Block
name: candidate_job_chart
type: view
view: candidates_by_job
display: chart
---
kind: Block
name: candidate_department_chart
type: view
view: candidates_by_department
display: chart
---
kind: Block
name: recent_candidate_list
type: view
view: recent_candidates
display: list
---
kind: Block
name: activity_timeline
type: view
view: recent_activity
display: timeline
---
kind: Block
name: candidate_summary
type: view
view: candidate_detail
inputs:
  id: {type: uuid, required: true}
bindings:
  id: {source: context, name: id, required: true}
display: summary
---
kind: Menu
name: main_navigation
items:
  - {label: Pipeline, route: /}
  - {label: Candidates, route: /candidates}
---
kind: Block
name: main_menu
type: menu
menu: main_navigation
---
kind: Panel
name: home_panel
layout: single-column
regions:
  - {name: main, blocks: [main_menu, candidate_metric, candidate_stage_chart, candidate_job_chart, candidate_department_chart, recent_candidate_list, candidate_search, candidate_board, activity_timeline]}
---
kind: Panel
name: candidate_panel
layout: single-column
regions:
  - {name: main, blocks: [main_menu, candidate_summary]}
---
kind: Page
name: home
route: /
title: Recruiting overview
panel: home_panel
filters:
  job:
    label: Job
    widget: text
    targets:
      - {block: candidate_metric, filter: job}
      - {block: candidate_stage_chart, filter: job}
      - {block: candidate_job_chart, filter: job}
      - {block: candidate_department_chart, filter: job}
      - {block: recent_candidate_list, filter: job}
      - {block: candidate_search, filter: job}
      - {block: candidate_board, filter: job}
  department:
    label: Department
    widget: text
    targets:
      - {block: candidate_metric, filter: department}
      - {block: candidate_stage_chart, filter: department}
      - {block: candidate_job_chart, filter: department}
      - {block: candidate_department_chart, filter: department}
      - {block: recent_candidate_list, filter: department}
      - {block: candidate_search, filter: department}
      - {block: candidate_board, filter: department}
  stage:
    label: Stage
    widget: select
    targets:
      - {block: candidate_metric, filter: stage}
      - {block: candidate_stage_chart, filter: stage}
      - {block: candidate_job_chart, filter: stage}
      - {block: candidate_department_chart, filter: stage}
      - {block: recent_candidate_list, filter: stage}
      - {block: candidate_search, filter: stage}
      - {block: candidate_board, filter: stage}
  applied_from:
    label: Applied from
    widget: date
    targets:
      - {block: candidate_metric, filter: applied_from}
      - {block: candidate_stage_chart, filter: applied_from}
      - {block: candidate_job_chart, filter: applied_from}
      - {block: candidate_department_chart, filter: applied_from}
      - {block: recent_candidate_list, filter: applied_from}
      - {block: candidate_search, filter: applied_from}
      - {block: candidate_board, filter: applied_from}
  applied_to:
    label: Applied to
    widget: date
    targets:
      - {block: candidate_metric, filter: applied_to}
      - {block: candidate_stage_chart, filter: applied_to}
      - {block: candidate_job_chart, filter: applied_to}
      - {block: candidate_department_chart, filter: applied_to}
      - {block: recent_candidate_list, filter: applied_to}
      - {block: candidate_search, filter: applied_to}
      - {block: candidate_board, filter: applied_to}
---
kind: Page
name: candidate
route: /candidates/:id
title: Candidate
panel: candidate_panel
context:
  id: {source: route, name: id, required: true}
---
kind: DemoSeed
name: credible_demo
entities:
  job: {count: 4, profile: jobs}
  candidate: {count: 18, profile: people}
  note: {count: 24, profile: notes}
  activity: {count: 30, profile: activities}
