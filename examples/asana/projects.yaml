kind: Entity
name: project
label: Project
policy: public_access
fields:
  - {label: Name, name: name, required: true, type: string}
  - {label: Description, name: description, type: text}
---
kind: View
name: projects
entity: project
fields: [id, name, description, created_at]
displays:
  list:
    type: block
    renderer: {type: list, titleField: name, bodyField: description, linkRoute: /projects/:id}
    pager: {type: cursor, pageSize: 50}
    emptyState: Create your first project below.
sort:
  - {desc: true, field: created_at}
---
kind: View
name: project_detail
entity: project
fields: [id, name, description, created_at]
exposedFilters:
  id: {name: id, required: true, type: uuid}
displays:
  summary:
    type: block
    renderer: {type: detail, titleField: name, bodyField: description}
    pager: {type: none, pageSize: 50}
    emptyState: Project not found.
---
kind: Webform
name: create_project_form
action: project_create
confirmation: Project created. Refresh to open it.
elements:
  - {name: name, required: true, type: text, maxLength: 120}
  - {name: description, type: textarea, maxLength: 2000}
---
kind: Block
name: project_list
type: view
view: projects
display: list
---
kind: Block
name: project_summary
type: view
view: project_detail
inputs:
  id: {required: true, type: uuid}
bindings:
  id: {source: context, name: id, required: true}
display: summary
---
kind: Block
name: create_project
type: webform
webform: create_project_form
