text: Create a project, then manage its tasks without accounts or external services.
---
kind: Block
name: project_help
type: text
text: The board contains root tasks. The tree below includes every nested subtask up to the local 200-task project limit.
---
kind: Block
name: task_help
type: text
text: Add a subtask to create the next hierarchy level, or upload one or more small attachments.
