kind: Filter
name: markdown
steps:
  - {type: markdown}
---
kind: Policy
name: published_only
condition:
  left: {name: status, source: record}
  op: eq
  right: {literal: published, source: literal}
---
kind: Entity
name: post
fields:
  - {label: Title, name: title, required: true, type: string}
  - {label: Slug, name: slug, required: true, type: slug, unique: true}
  - {label: Excerpt, name: excerpt, required: true, type: text}
  - {label: Body, name: body, required: true, type: richtext}
  - {label: Author, name: author_display_name, required: true, type: string}
  - label: Category
    name: category_id
    relation: {entity: category, kind: many-to-one, targetField: id}
    required: true
    type: relation
  - label: Tags
    name: tags
    relation: {entity: tag, kind: many-to-many, targetField: id}
    type: relation
  - label: Status
    name: status
    options: [draft, published]
    required: true
    type: enum
  - {label: Published, name: published_at, type: datetime}
indexes:
  - [status, published_at]
  - [category_id]
label: Post
policy: editor_only
---
kind: View
name: published_posts
defaultLimit: 10
displays:
  api: {route: /api/blog/posts, type: json}
  home:
    type: block
    renderer:
      type: list
      titleField: title
      bodyField: excerpt
      linkRoute: /posts/:slug
      metaFields: [author_display_name, published_at]
    pager: {type: cursor, pageSize: 10}
    emptyState: No published posts yet.
  rss: {route: /rss.xml, type: rss}
entity: post
fields: [id, title, slug, excerpt, author_display_name, category_id, published_at]
filter:
  left: {name: status, source: record}
  op: eq
  right: {literal: published, source: literal}
maxLimit: 50
policy: published_only
sort:
  - {desc: true, field: published_at}
---
kind: View
name: published_post
defaultLimit: 50
displays:
  detail:
    type: block
    title: {field: title, fallback: Post}
    renderer:
      type: detail
      titleField: title
      bodyField: body
      metaFields: [author_display_name, published_at, category.name, tags.name]
    pager: {type: none, pageSize: 50}
    emptyState: Post not found.
  record:
    type: page
    route: /posts/:slug/record
    title: {field: title, fallback: Post}
    bindings:
      slug: {source: route, name: slug, required: true}
    renderer:
      type: detail
      layout:
        groups:
          - name: publication
            label: Publication
            columns: 2
            fields:
              - {field: author_display_name}
              - {field: published_at}
          - name: content
            label: Content
            fields:
              - {field: excerpt}
              - {field: body, span: full}
    pager: {type: none, pageSize: 50}
    emptyState: Post not found.
entity: post
exposedFilters:
  slug: {name: slug, required: true, type: slug}
fieldFilters: {body: markdown}
fields: [id, title, slug, excerpt, body, author_display_name, published_at, category.name, category.slug, tags.name, tags.slug]
filter:
  left: {name: status, source: record}
  op: eq
  right: {literal: published, source: literal}
maxLimit: 50
policy: published_only
relationships:
  - {entity: category, localField: category_id, name: category, targetField: id, type: inner}
  - {name: tags, relationField: tags, type: left}
sort:
  - {field: id}
---
kind: View
name: post_admin
entity: post
fields: [id, title, slug, excerpt, body, author_display_name, category_id, tags, status, published_at, created_at, updated_at, version]
policy: editor_only
sort:
  - {desc: true, field: updated_at}
---
kind: Action
name: save_post_draft
entity: post
input:
  author_display_name: {required: true, type: string}
  body: {required: true, type: richtext}
  category_id:
    relation: {entity: category, kind: many-to-one, targetField: id}
    required: true
    type: relation
  excerpt: {required: true, type: text}
  slug: {required: true, type: slug}
  tags:
    relation: {entity: tag, kind: many-to-many, targetField: id}
    type: relation
  title: {required: true, type: string}
operation: transaction
policy: editor_only
steps:
  - op: create
    values: {author_display_name: $input.author_display_name, body: $input.body, category_id: $input.category_id, excerpt: $input.excerpt, slug: $input.slug, status: draft, tags: $input.tags, title: $input.title}
---
kind: Action
name: post_status_transition_guard
entity: post
operation: transition
policy: editor_only
transitions: {}
---
kind: Action
name: publish_post
confirm: Publish this draft?
entity: post
input:
  id: {required: true, type: uuid}
operation: transaction
policy: editor_only
steps:
  - op: transition
    values: {id: $input.id, published_at: $now, status: published}
transitions:
  draft: [published]
---
kind: AdminResource
name: post
actions: [publish_post]
createAction: save_post_draft
description: Draft and published posts
entity: post
form:
  fields: [title, slug, excerpt, body, author_display_name, category_id, tags]
  readonly: [status, published_at, created_at, updated_at, version]
  layout:
    groups:
      - name: content
        label: Content
        columns: 2
        fields:
          - {field: title}
          - {field: slug}
          - {field: excerpt, span: full}
          - {field: body, span: full}
      - name: classification
        label: Classification
        columns: 2
        fields:
          - {field: author_display_name}
          - {field: category_id}
          - {field: tags, span: full}
labelField: title
list:
  columns: [id, title, slug, status, category_id, published_at, updated_at]
  filters: [status, category_id]
  pageSize: 25
  search: [title, excerpt, body]
  sort:
    - {desc: true, field: updated_at}
view: post_admin
---
kind: Block
name: home_posts
type: view
view: published_posts
display: home
---
kind: Block
name: post_detail
bindings:
  slug: {name: slug, required: true, source: context}
inputs:
  slug: {required: true, type: slug}
type: view
view: published_post
display: detail
---
kind: Panel
name: home_panel
layout: single-column
regions:
  - name: main
    items:
      - block: public_menu
      - id: feed_introduction
        content:
          - {type: heading, text: Latest posts}
          - {type: paragraph, text: Published writing from the Bean Blog editorial team.}
      - block: home_posts
---
kind: Panel
name: post_content_panel
layout: single-column
regions:
  - name: main
    blocks: [public_menu, post_detail]
---
kind: Panel
name: post_discussion_panel
layout: main-sidebar
regions:
  - name: main
    items:
      - id: discussion_heading
        content:
          - {type: heading, text: Discussion}
      - block: post_comments
  - name: sidebar
    blocks: [comment_form_intro, submit_comment_form]
    collapseWhenEmpty: true
---
kind: Page
name: home
route: /
title: Bean Blog
sections:
  - {id: feed, panel: home_panel, width: contained}
---
kind: Page
name: post
context:
  slug: {name: slug, required: true, source: route}
route: /posts/:slug
title: Post
sections:
  - {id: content, panel: post_content_panel, width: contained}
  - {id: discussion, panel: post_discussion_panel, width: wide}
