kind: Entity
name: category
fields:
  - {label: Name, name: name, required: true, type: string, unique: true}
  - {label: Slug, name: slug, required: true, type: slug, unique: true}
label: Category
policy: editor_only
---
kind: Entity
name: tag
fields:
  - {label: Name, name: name, required: true, type: string, unique: true}
  - {label: Slug, name: slug, required: true, type: slug, unique: true}
label: Tag
policy: editor_only
---
kind: View
name: published_posts_by_category
defaultLimit: 10
entity: post
exposedFilters:
  category_slug: {name: category.slug, required: true, type: slug}
fields: [id, title, slug, excerpt, author_display_name, published_at]
filter:
  left: {name: status, source: record}
  op: eq
  right: {literal: published, source: literal}
maxLimit: 50
policy: published_only
relationships:
  - {entity: category, localField: category_id, name: category, targetField: id, type: inner}
sort:
  - {desc: true, field: published_at}
---
kind: View
name: published_posts_by_tag
defaultLimit: 10
entity: post
exposedFilters:
  tag_slug: {name: tags.slug, required: true, type: slug}
fields: [id, title, slug, excerpt, author_display_name, published_at]
filter:
  left: {name: status, source: record}
  op: eq
  right: {literal: published, source: literal}
maxLimit: 50
policy: published_only
relationships:
  - {name: tags, relationField: tags, type: inner}
sort:
  - {desc: true, field: published_at}
---
kind: View
name: public_categories
defaultLimit: 50
entity: category
fields: [id, name, slug]
maxLimit: 100
sort:
  - {field: name}
---
kind: View
name: public_tags
defaultLimit: 50
entity: tag
fields: [id, name, slug]
maxLimit: 100
sort:
  - {field: name}
---
kind: AdminResource
name: category
description: Blog categories
entity: category
form:
  fields: [name, slug]
labelField: name
list:
  columns: [id, name, slug, updated_at]
  pageSize: 25
  search: [name]
  sort:
    - {field: name}
---
kind: AdminResource
name: tag
description: Post tags
entity: tag
form:
  fields: [name, slug]
labelField: name
list:
  columns: [id, name, slug, updated_at]
  pageSize: 25
  search: [name]
  sort:
    - {field: name}
---
kind: Block
name: category_index
presentation: {emptyState: No categories yet., linkRoute: '/categories/:slug', mode: list, titleField: name}
type: view
view: public_categories
---
kind: Block
name: category_posts
bindings:
  category_slug: {name: slug, required: true, source: context}
inputs:
  category_slug: {required: true, type: slug}
presentation: {bodyField: excerpt, emptyState: No published posts in this category., linkRoute: '/posts/:slug', mode: list, titleField: title}
type: view
view: published_posts_by_category
---
kind: Block
name: tag_index
presentation: {emptyState: No tags yet., linkRoute: '/tags/:slug', mode: list, titleField: name}
type: view
view: public_tags
---
kind: Block
name: tag_posts
bindings:
  tag_slug: {name: slug, required: true, source: context}
inputs:
  tag_slug: {required: true, type: slug}
presentation: {bodyField: excerpt, emptyState: No published posts with this tag., linkRoute: '/posts/:slug', mode: list, titleField: title}
type: view
view: published_posts_by_tag
---
kind: Panel
name: categories_panel
layout: single-column
regions:
  - blocks: [public_menu, category_index]
    name: main
---
kind: Panel
name: category_panel
layout: single-column
regions:
  - blocks: [public_menu, category_posts]
    name: main
---
kind: Panel
name: tags_panel
layout: single-column
regions:
  - blocks: [public_menu, tag_index]
    name: main
---
kind: Panel
name: tag_panel
layout: single-column
regions:
  - blocks: [public_menu, tag_posts]
    name: main
---
kind: Page
name: categories
panel: categories_panel
route: /categories
title: Categories
---
kind: Page
name: category
context:
  slug: {name: slug, required: true, source: route}
panel: category_panel
route: /categories/:slug
title: Category
---
kind: Page
name: tags
panel: tags_panel
route: /tags
title: Tags
---
kind: Page
name: tag
context:
  slug: {name: slug, required: true, source: route}
panel: tag_panel
route: /tags/:slug
title: Tag
