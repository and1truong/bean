apiVersion: bean/v1alpha1
name: Community
---
kind: Entity
name: profile
fields:
  - {label: Display name, name: display_name, required: true, type: string}
label: Profile
owner: true
---
kind: Entity
name: post
fields:
  - {label: Body, name: body, required: true, type: text}
  - label: Visibility
    name: visibility
    options: [private, public]
    required: true
    type: enum
label: Post
owner: true
policy: community_posts
---
kind: Entity
name: comment
fields:
  - {label: Post, name: post_id, required: true, type: relation}
  - {label: Body, name: body, required: true, type: text}
label: Comment
owner: true
---
kind: Entity
name: reaction
fields:
  - {label: Post, name: post_id, required: true, type: relation}
  - label: Kind
    name: kind
    options: [like, celebrate]
    required: true
    type: enum
label: Reaction
owner: true
policy: member_owned
---
kind: Entity
name: follow
fields:
  - {label: Profile, name: profile_id, required: true, type: relation}
label: Follow
owner: true
---
kind: Policy
name: community_posts
owner: true
ownerOrPublic: true
publicField: visibility
publicValue: public
writeRoles: [member]
---
kind: Policy
name: member_owned
owner: true
readRoles: [member]
writeRoles: [member]
---
kind: View
name: public_feed
displays:
  api: {route: /api/feed, type: json}
  home:
    type: page
    route: /
    title: {text: Community}
    description: Public posts from the community.
    renderer: {type: list, bodyField: body}
    pager: {type: cursor, pageSize: 10}
    emptyState: No public posts yet.
entity: post
fields: [id, body, visibility, owner_id]
filter:
  left: {name: visibility, source: record}
  op: eq
  right: {literal: public, source: literal}
policy: community_posts
---
kind: Action
name: publish_post
entity: post
operation: transition
policy: community_posts
stateField: visibility
transitions:
  private: [public]
---
kind: AdminResource
name: post
entity: post
description: Manage post
actions: [publish_post]
