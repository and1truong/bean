apiVersion: bean/v1alpha1
name: CMS / News
---
kind: Entity
name: article
fields:
  - {label: Title, name: title, required: true, type: string}
  - {label: Body, name: body, type: richtext}
  - label: Status
    name: status
    options: [draft, published]
    required: true
    type: enum
  - {label: Category, name: category_id, type: relation}
  - {label: Published, name: published_at, type: datetime}
label: Article
---
kind: Entity
name: category
fields:
  - {label: Name, name: name, required: true, type: string, unique: true}
label: Category
---
kind: Entity
name: author
fields:
  - {label: Name, name: name, required: true, type: string}
  - {label: Email, name: email, type: email}
label: Author
---
kind: View
name: news
displays:
  api: {route: /api/news, type: json}
  export: {route: /news.csv, type: csv}
  feed: {route: /news.rss, type: rss}
entity: article
fields: [id, title, body, status, published_at]
filter:
  left: {name: status, source: record}
  op: eq
  right: {literal: published, source: literal}
sort:
  - {desc: true, field: published_at}
---
kind: Action
name: publish_article
entity: article
operation: transition
transitions:
  draft: [published]
---
kind: AdminResource
name: article
actions: [publish_article]
description: Editorial content
entity: article
labelField: title
list:
  columns: [id, title, status, category_id, updated_at]
  filters: [status, category_id]
  pageSize: 25
  search: [title, body]
  sort:
    - {desc: true, field: updated_at}
---
kind: Job
name: scheduled_publish
action: publish_article
---
kind: Block
name: news_list
type: view
view: news
---
kind: Panel
name: news_panel
layout: single-column
regions:
  - blocks: [news_list]
    name: main
---
kind: Page
name: home
panel: news_panel
route: /
title: News
---
kind: Role
name: editor
permissions: [article_create, article_update, publish_article]
