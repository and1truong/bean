apiVersion: bean/v1alpha1
name: Commerce
---
kind: DemoSeed
name: credible_demo
entities:
  product: {count: 12, profile: auto}
  order: {count: 18, profile: auto}
---
kind: Entity
name: product
fields:
  - {label: Name, name: name, required: true, type: string}
  - {label: Price, name: price, required: true, type: money}
  - {label: Inventory, name: inventory, required: true, type: integer}
label: Product
---
kind: Entity
name: order
fields:
  - label: Status
    name: status
    options: [pending_payment, paid, fulfilled]
    required: true
    type: enum
  - {label: Payment, name: payment_result, type: string}
label: Order
---
kind: Entity
name: order_item
fields:
  - {label: Order, name: order_id, required: true, type: relation}
  - {label: Product, name: product_id, required: true, type: relation}
  - {label: Quantity, name: quantity, required: true, type: integer}
  - {label: Unit price, name: unit_price, required: true, type: money}
  - {label: Line total, name: line_total, required: true, type: money}
label: Order Item
---
kind: Rule
name: order_item_total
entity: order_item
result: number
input:
  quantity: {type: integer}
  unit_price: {type: money}
expression:
  op: multiply
  args:
    - {source: input, path: quantity}
    - {source: input, path: unit_price}
---
kind: Action
name: order_item_create
entity: order_item
operation: create
derive:
  line_total: order_item_total
---
kind: Lifecycle
name: order_fulfillment
entity: order
initial: pending_payment
transitions:
  pending_payment: [paid]
  paid: [fulfilled]
---
kind: Extension
name: order_notification
transport: http
endpoint: https://provider.example/orders
input:
  order_id: {required: true, type: uuid}
  quantity: {required: true, type: integer}
output:
  accepted: {required: true, type: boolean}
permissions: [network]
sideEffects: [external_write]
authentication: none
timeoutSeconds: 5
retry: {maxAttempts: 3, delaySeconds: 60}
idempotency: required
transaction: after_commit
failure: retry_then_fail
---
kind: Action
name: place_order
entity: order
input:
  product_id: {required: true, type: relation}
  quantity: {required: true, type: integer}
operation: transaction
output:
  payment: {type: string}
steps:
  - op: decrement
    values: {amount_input: quantity, entity: product, field: inventory, id_input: product_id, message: Product is out of stock.}
  - op: create
    result: order
    values: {payment_result: deterministic-success, status: pending_payment}
  - event: order_placed
    op: emit
    values: {product_id: $input.product_id, quantity: $input.quantity}
  - op: extension
    extension: order_notification
    values: {order_id: $result.order.id, quantity: $input.quantity}
  - op: return
    values: {payment: deterministic-success}
---
kind: Action
name: advance_order
entity: order
operation: transition
lifecycle: order_fulfillment
---
kind: Webform
name: checkout
action: place_order
confirmation: Order placed.
elements:
  - {name: product_id, required: true, type: entity reference}
  - {name: quantity, required: true, type: number}
---
kind: View
name: products
displays:
  api: {route: /api/products, type: json}
entity: product
fields: [id, name, price, inventory]
---
kind: View
name: low_inventory_product_records
entity: product
fields: [id, name, price, inventory]
filter:
  op: lte
  left: {source: record, name: inventory}
  right: {source: literal, literal: 30}
sort:
  - {field: inventory}
displays:
  page:
    type: page
    route: /low-inventory
    title: {text: Low inventory products}
    renderer:
      type: table
      fields:
        - {field: name, label: Product}
        - {field: inventory, label: Inventory}
        - {field: price, label: Price}
    pager: {type: cursor, pageSize: 25}
---
kind: View
name: low_inventory_product_count
entity: product
filter:
  op: lte
  left: {source: record, name: inventory}
  right: {source: literal, literal: 30}
aggregates:
  - {function: count, field: id, alias: product_count}
displays:
  metric:
    type: block
    renderer: {type: metric, metricField: product_count, metricLabel: Low inventory products}
    pager: {type: none, pageSize: 1}
    drill: {view: low_inventory_product_records, display: page}
---
kind: View
name: order_records
entity: order
fields: [id, status, payment_result, updated_at]
exposedFilters:
  status: {field: status, operator: eq}
sort:
  - {field: updated_at, desc: true}
displays:
  page:
    type: page
    route: /orders
    title: {text: Orders}
    selection: multiple
    actions: [advance_order]
    renderer:
      type: table
      fields:
        - {field: id, label: Order}
        - {field: status, label: Status}
        - {field: payment_result, label: Payment}
    controls:
      - {filter: status, label: Status, widget: select}
    pager: {type: cursor, pageSize: 25}
---
kind: View
name: orders_by_status
entity: order
fields: [status]
groupBy:
  - {field: status}
aggregates:
  - {function: count, field: id, alias: order_count}
displays:
  chart:
    type: block
    renderer: {type: chart, groupField: status, metricField: order_count, metricLabel: Orders by status}
    pager: {type: none, pageSize: 200}
    drill:
      view: order_records
      display: page
      bindings:
        - {source: group, name: status, filter: status}
---
kind: View
name: paid_unfulfilled_orders
entity: order
fields: [id, status, payment_result, updated_at]
filter:
  op: eq
  left: {source: record, name: status}
  right: {source: literal, literal: paid}
sort:
  - {field: updated_at, desc: true}
displays:
  page:
    type: page
    route: /paid-orders
    title: {text: Paid orders awaiting fulfillment}
    selection: multiple
    actions: [advance_order]
    renderer:
      type: table
      fields:
        - {field: id, label: Order}
        - {field: status, label: Status}
        - {field: payment_result, label: Payment}
    pager: {type: cursor, pageSize: 25}
---
kind: View
name: paid_unfulfilled_count
entity: order
filter:
  op: eq
  left: {source: record, name: status}
  right: {source: literal, literal: paid}
aggregates:
  - {function: count, field: id, alias: order_count}
displays:
  metric:
    type: block
    renderer: {type: metric, metricField: order_count, metricLabel: Paid orders awaiting fulfillment}
    pager: {type: none, pageSize: 1}
    drill: {view: paid_unfulfilled_orders, display: page}
---
kind: Block
name: low_inventory_metric
type: view
view: low_inventory_product_count
display: metric
---
kind: Block
name: order_status_chart
type: view
view: orders_by_status
display: chart
---
kind: Block
name: paid_unfulfilled_metric
type: view
view: paid_unfulfilled_count
display: metric
---
kind: Panel
name: commerce_operations_panel
layout: single-column
regions:
  - {name: main, blocks: [low_inventory_metric, order_status_chart, paid_unfulfilled_metric]}
---
kind: Page
name: commerce_operations
route: /
title: Commerce operations
description: Observe inventory and fulfillment issues, inspect contributing records, and act.
panel: commerce_operations_panel
---
kind: TestSuite
name: order_item_total_contract
target: {kind: Rule, name: order_item_total}
tests:
  - name: calculates_line_total
    input: {quantity: 3, unit_price: 12.5}
    expect: {result: 37.5}
---
kind: TestSuite
name: place_order_contract
target: {kind: Action, name: place_order}
tests:
  - name: decrements_inventory_and_emits_event
    fixtures:
      product:
        - {id: 00000000-0000-4000-8000-000000000101, name: Widget, price: 12.5, inventory: 5}
    context:
      actor: {id: 00000000-0000-4000-8000-000000000103, roles: [administrator]}
      time: "2026-09-01T10:00:00Z"
      requestId: commerce-test
      ids: [00000000-0000-4000-8000-000000000102, 00000000-0000-4000-8000-000000000105]
    input: {product_id: 00000000-0000-4000-8000-000000000101, quantity: 2}
    providers:
      order_notification:
        - output: {accepted: true}
    expect:
      result: {payment: deterministic-success}
      changes:
        - {entity: product, id: 00000000-0000-4000-8000-000000000101, values: {inventory: 3}}
        - {entity: order, id: 00000000-0000-4000-8000-000000000102, values: {status: pending_payment, payment_result: deterministic-success}}
      events:
        - {topic: order_placed, payload: {product_id: 00000000-0000-4000-8000-000000000101, quantity: 2}}
      providerCalls:
        - extension: order_notification
          invocationId: 00000000-0000-4000-8000-000000000105
          idempotencyKey: 00000000-0000-4000-8000-000000000105
          input: {order_id: 00000000-0000-4000-8000-000000000102, quantity: 2}
---
kind: TestSuite
name: advance_order_contract
target: {kind: Action, name: advance_order}
tests:
  - name: advances_pending_order
    fixtures:
      order:
        - {id: 00000000-0000-4000-8000-000000000104, status: pending_payment}
    context:
      actor: {id: 00000000-0000-4000-8000-000000000103, roles: [administrator]}
      time: "2026-09-01T10:00:00Z"
      requestId: commerce-transition-test
    input: {id: 00000000-0000-4000-8000-000000000104, status: paid}
    expect:
      result: {id: 00000000-0000-4000-8000-000000000104, status: paid}
      changes:
        - {entity: order, id: 00000000-0000-4000-8000-000000000104, values: {status: paid, version: 2}}
      noEvents: true
