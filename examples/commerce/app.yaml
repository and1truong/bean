apiVersion: bean/v1alpha1
name: Commerce
---
kind: Entity
name: product
fields:
  - {label: Name, name: name, required: true, type: string}
  - {label: Price, name: price, required: true, type: money}
  - {label: Inventory, name: inventory, required: true, type: integer}
label: Product
---
kind: Entity
name: order
fields:
  - label: Status
    name: status
    options: [pending_payment, paid, fulfilled]
    required: true
    type: enum
  - {label: Payment, name: payment_result, type: string}
label: Order
---
kind: Entity
name: order_item
fields:
  - {label: Order, name: order_id, required: true, type: relation}
  - {label: Product, name: product_id, required: true, type: relation}
  - {label: Quantity, name: quantity, required: true, type: integer}
  - {label: Unit price, name: unit_price, required: true, type: money}
label: Order Item
---
kind: Action
name: place_order
entity: order
input:
  product_id: {required: true, type: relation}
  quantity: {required: true, type: integer}
operation: transaction
output:
  payment: {type: string}
steps:
  - op: decrement
    values: {amount_input: quantity, entity: product, field: inventory, id_input: product_id, message: Product is out of stock.}
  - op: create
    values: {payment_result: deterministic-success, status: pending_payment}
  - {event: order_placed, op: emit}
  - op: return
    values: {payment: deterministic-success}
---
kind: Action
name: advance_order
entity: order
operation: transition
transitions:
  paid: [fulfilled]
  pending_payment: [paid]
---
kind: Webform
name: checkout
action: place_order
confirmation: Order placed.
elements:
  - {name: product_id, required: true, type: entity reference}
  - {name: quantity, required: true, type: number}
---
kind: View
name: products
displays:
  api: {route: /api/products, type: json}
entity: product
fields: [id, name, price, inventory]
