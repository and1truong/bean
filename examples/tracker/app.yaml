apiVersion: bean/v1alpha1
name: Issue Tracker
---
kind: Theme
name: default
displayName: Northstar Tracker
preset: minimal
accent: blue
---
kind: DemoSeed
name: credible_demo
entities:
  project: {count: 6, profile: auto}
  issue: {count: 30, profile: auto}
  comment: {count: 45, profile: notes}
---
kind: Entity
name: project
fields:
  - {label: Name, name: name, required: true, type: string}
label: Project
---
kind: Entity
name: issue
fields:
  - {label: Title, name: title, required: true, type: string}
  - label: Status
    name: status
    options: [todo, in_progress, done]
    required: true
    type: enum
  - {label: Assignee, name: assignee_id, type: uuid}
  - {label: Project, name: project_id, type: relation}
label: Issue
---
kind: Entity
name: comment
fields:
  - {label: Issue, name: issue_id, required: true, type: relation}
  - {label: Body, name: body, required: true, type: text}
label: Comment
---
kind: View
name: issue_kanban
displays:
  kanban: {route: /api/issues/kanban, type: json}
  board:
    type: block
    renderer: {type: board, titleField: title, groupField: status, columns: [todo, in_progress, done], moveAction: move_issue, metaFields: [project_id, assignee_id]}
    pager: {type: none, pageSize: 200}
  page:
    type: page
    route: /issues
    title: {text: Issues}
    selection: multiple
    actions: [move_issue]
    renderer:
      type: table
      fields:
        - {field: title, label: Issue}
        - {field: status, label: Status}
        - {field: project_id, label: Project}
        - {field: assignee_id, label: Assignee}
    controls:
      - {filter: status, label: Status, widget: select}
      - {filter: project, label: Project, widget: auto}
      - {filter: assignee, label: Assignee, widget: auto}
    pager: {type: cursor, pageSize: 25}
entity: issue
fields: [id, title, status, project_id, assignee_id]
exposedFilters:
  status: {field: status, operator: eq}
  project: {field: project_id, operator: eq}
  assignee: {field: assignee_id, operator: eq}
sort:
  - {field: status}
  - {field: id}
---
kind: Action
name: move_issue
entity: issue
operation: transition
transitions:
  in_progress: [done]
  todo: [in_progress]
---
kind: View
name: issues_by_status
entity: issue
fields: [status]
groupBy:
  - {field: status}
aggregates:
  - {function: count, field: id, alias: issue_count}
displays:
  chart:
    type: block
    renderer: {type: chart, groupField: status, metricField: issue_count, metricLabel: Issues by status}
    pager: {type: none, pageSize: 200}
    drill:
      view: issue_kanban
      display: page
      bindings:
        - {source: group, name: status, filter: status}
---
kind: Block
name: issue_status_chart
type: view
view: issues_by_status
display: chart
---
kind: Block
name: issue_board
type: view
view: issue_kanban
display: board
---
kind: Panel
name: tracker_intro
layout: single-column
regions:
  - name: main
    items:
      - id: overview
        content:
          - {type: heading, text: "Operate the issue lifecycle"}
          - {type: paragraph, text: "Review status distribution, then move authorized work across the board."}
---
kind: Panel
name: tracker_operations
layout: two-column
regions:
  - {name: left, blocks: [issue_status_chart]}
  - {name: right, blocks: [issue_board]}
---
kind: Page
name: tracker_home
route: /
title: Issue operations
sections:
  - {id: introduction, panel: tracker_intro}
  - {id: operations, panel: tracker_operations}
