apiVersion: bean/v1alpha1
name: Issue Tracker
---
kind: Entity
name: project
fields:
  - {label: Name, name: name, required: true, type: string}
label: Project
---
kind: Entity
name: issue
fields:
  - {label: Title, name: title, required: true, type: string}
  - label: Status
    name: status
    options: [todo, in_progress, done]
    required: true
    type: enum
  - {label: Assignee, name: assignee_id, type: uuid}
  - {label: Project, name: project_id, type: relation}
label: Issue
---
kind: Entity
name: comment
fields:
  - {label: Issue, name: issue_id, required: true, type: relation}
  - {label: Body, name: body, required: true, type: text}
label: Comment
---
kind: View
name: issue_kanban
displays:
  kanban: {route: /api/issues/kanban, type: json}
entity: issue
fields: [id, title, status, assignee_id]
---
kind: Action
name: move_issue
entity: issue
operation: transition
transitions:
  in_progress: [done]
  todo: [in_progress]
