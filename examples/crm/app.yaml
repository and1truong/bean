apiVersion: bean/v1alpha1
name: CRM
---
kind: Theme
name: default
displayName: Acme CRM
preset: professional
accent: emerald
---
kind: DemoSeed
name: credible_demo
entities:
  company: {count: 12, profile: companies}
  contact: {count: 40, profile: people}
  deal: {count: 28, profile: auto}
  activity: {count: 36, profile: activities}
---
kind: Entity
name: company
fields:
  - {label: Name, name: name, required: true, type: string}
label: Company
owner: true
---
kind: Entity
name: contact
fields:
  - {label: Name, name: name, required: true, type: string}
  - {label: Email, name: email, type: email}
  - {label: Company, name: company_id, type: relation}
label: Contact
owner: true
policy: owned_records
---
kind: Entity
name: deal
fields:
  - {label: Title, name: title, required: true, type: string}
  - label: Stage
    name: status
    options: [lead, qualified, won, lost]
    required: true
    type: enum
  - {label: Amount, name: amount, type: money}
label: Deal
owner: true
policy: owned_records
---
kind: Entity
name: activity
fields:
  - {label: Subject, name: subject, required: true, type: string}
  - {label: Deal, name: deal_id, type: relation}
  - {label: Occurred, name: occurred_at, type: datetime}
label: Activity
owner: true
---
kind: Policy
name: owned_records
bypassOwnerRoles: [manager]
owner: true
readRoles: [salesperson, manager]
writeRoles: [salesperson, manager]
---
kind: Policy
name: manager_records
readRoles: [manager]
writeRoles: [manager]
---
kind: Policy
name: crm_page_access
readRoles: [salesperson, manager]
---
kind: View
name: contacts
displays:
  table: {route: /api/contacts, type: json}
entity: contact
fields: [id, name, email, owner_id]
policy: owned_records
---
kind: View
name: deal_records
entity: deal
fields: [id, title, status, amount, owner_id, updated_at]
search: {fields: [title]}
exposedFilters:
  stage: {field: status, operator: eq}
policy: owned_records
sort:
  - {field: updated_at, desc: true}
displays:
  page:
    type: page
    selection: multiple
    actions: [move_deal]
    route: /deals
    title: {text: Deals}
    renderer:
      type: table
      fields:
        - {field: title, label: Deal}
        - {field: status, label: Stage}
        - {field: amount, label: Amount}
    controls:
      - {filter: stage, label: Stage, widget: select}
    pager: {type: cursor, pageSize: 25}
---
kind: View
name: deal_pipeline
displays:
  kanban: {route: /api/deals, type: json}
entity: deal
fields: [id, title, status, amount]
policy: owned_records
---
kind: View
name: deals_by_stage
entity: deal
fields: [status]
groupBy:
  - {field: status}
aggregates:
  - {function: count, field: id, alias: deal_count}
policy: owned_records
displays:
  chart:
    type: block
    renderer: {type: chart, groupField: status, metricField: deal_count, metricLabel: Deals by stage}
    pager: {type: none, pageSize: 200}
    drill:
      view: deal_records
      display: page
      bindings:
        - {source: group, name: status, filter: stage}
---
kind: View
name: pipeline_amount_by_stage
entity: deal
fields: [status]
groupBy:
  - {field: status}
aggregates:
  - {function: sum, field: amount, alias: pipeline_amount}
policy: owned_records
displays:
  chart:
    type: block
    renderer: {type: chart, groupField: status, metricField: pipeline_amount, metricLabel: Pipeline amount by stage}
    pager: {type: none, pageSize: 200}
    drill:
      view: deal_records
      display: page
      bindings:
        - {source: group, name: status, filter: stage}
---
kind: View
name: open_deal_records
entity: deal
fields: [id, title, status, amount, owner_id, updated_at]
filter:
  op: in
  left: {source: record, name: status}
  right: {source: literal, literal: [lead, qualified]}
policy: owned_records
sort:
  - {field: updated_at, desc: true}
displays:
  page:
    type: page
    route: /open-deals
    title: {text: Open deals}
    renderer:
      type: table
      fields:
        - {field: title, label: Deal}
        - {field: status, label: Stage}
        - {field: amount, label: Amount}
    pager: {type: cursor, pageSize: 25}
---
kind: View
name: open_pipeline_value
entity: deal
aggregates:
  - {function: sum, field: amount, alias: pipeline_amount}
filter:
  op: in
  left: {source: record, name: status}
  right: {source: literal, literal: [lead, qualified]}
policy: owned_records
displays:
  metric:
    type: block
    renderer: {type: metric, metricField: pipeline_amount, metricLabel: Open pipeline value}
    pager: {type: none, pageSize: 1}
    drill: {view: open_deal_records, display: page}
---
kind: Action
name: move_deal
entity: deal
operation: transition
policy: owned_records
transitions:
  lead: [qualified]
  qualified: [won, lost]
---
kind: Role
name: salesperson
permissions: [contacts, deal_pipeline, deal_records, deals_by_stage, pipeline_amount_by_stage, open_deal_records, open_pipeline_value, move_deal]
---
kind: Role
name: manager
permissions: [contacts, deal_pipeline, deal_records, deals_by_stage, pipeline_amount_by_stage, open_deal_records, open_pipeline_value, move_deal]
