apiVersion: bean/v1alpha1
name: Booking
---
kind: Entity
name: resource
fields:
  - {label: Name, name: name, required: true, type: string}
label: Resource
---
kind: Entity
name: booking
fields:
  - {label: Resource, name: resource_id, required: true, type: relation}
  - {label: Start, name: start_at, required: true, type: datetime}
  - {label: End, name: end_at, required: true, type: datetime}
  - label: Status
    name: status
    options: [confirmed, cancelled]
    required: true
    type: enum
label: Booking
---
kind: Action
name: book_resource
entity: booking
input:
  end_at: {required: true, type: datetime}
  resource_id: {required: true, type: relation}
  start_at: {required: true, type: datetime}
operation: transaction
steps:
  - op: assert_no_overlap
    values: {end: end_at, match: resource_id, message: The requested booking overlaps an existing booking., start: start_at}
  - op: create
    result: booking
    values: {end_at: $input.end_at, resource_id: $input.resource_id, start_at: $input.start_at, status: confirmed}
  - job: booking_reminder
    op: schedule
    values: {id: $result.booking.id, status: cancelled}
---
kind: Action
name: cancel_booking
entity: booking
operation: transition
transitions:
  confirmed: [cancelled]
---
kind: Job
name: booking_reminder
action: cancel_booking
---
kind: View
name: resource_calendar
displays:
  calendar: {route: /api/calendar, type: json}
entity: booking
fields: [id, resource_id, start_at, end_at, status]
