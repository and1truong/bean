name: Booking
definitions:
  - {apiVersion: bean/v1alpha1, kind: Entity, metadata: {name: resource}, spec: {label: Resource, fields: [{name: name, label: Name, type: string, required: true}]}}
  - {apiVersion: bean/v1alpha1, kind: Entity, metadata: {name: booking}, spec: {label: Booking, fields: [{name: resource_id, label: Resource, type: relation, required: true}, {name: start_at, label: Start, type: datetime, required: true}, {name: end_at, label: End, type: datetime, required: true}, {name: status, label: Status, type: enum, required: true, options: [confirmed, cancelled]}]}}
  - apiVersion: bean/v1alpha1
    kind: Action
    metadata: {name: book_resource}
    spec:
      entity: booking
      operation: transaction
      input: {resource_id: {type: relation, required: true}, start_at: {type: datetime, required: true}, end_at: {type: datetime, required: true}}
      steps:
        - {op: assert_no_overlap, values: {match: resource_id, start: start_at, end: end_at, message: The requested booking overlaps an existing booking.}}
        - {op: create, values: {resource_id: $input.resource_id, start_at: $input.start_at, end_at: $input.end_at, status: confirmed}}
        - {op: schedule, job: booking_reminder}
  - {apiVersion: bean/v1alpha1, kind: Action, metadata: {name: cancel_booking}, spec: {entity: booking, operation: transition, transitions: {confirmed: [cancelled]}}}
  - {apiVersion: bean/v1alpha1, kind: Job, metadata: {name: booking_reminder}, spec: {action: cancel_booking}}
  - {apiVersion: bean/v1alpha1, kind: View, metadata: {name: resource_calendar}, spec: {entity: booking, fields: [id, resource_id, start_at, end_at, status], displays: {calendar: {type: json, route: /api/calendar}}}}
seed: {}
