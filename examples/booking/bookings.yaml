kind: DemoSeed
name: credible_demo
entities:
  resource: {count: 4, profile: auto}
  booking: {count: 16, profile: auto}
---
kind: Entity
name: booking
fields:
  - {label: Resource, name: resource_id, required: true, type: relation}
  - {label: Start, name: start_at, required: true, type: datetime}
  - {label: End, name: end_at, required: true, type: datetime}
  - {label: Requested, name: requested_at, required: true, type: datetime}
  - label: Status
    name: status
    options: [confirmed, cancelled]
    required: true
    type: enum
label: Booking
validations:
  valid_interval: booking_interval_valid
---
kind: Rule
name: booking_interval_valid
entity: booking
result: boolean
expression:
  op: lt
  args:
    - {source: this, path: start_at}
    - {source: this, path: end_at}
---
kind: Rule
name: booking_requested_now
entity: booking
result: datetime
expression: {source: context, path: now}
---
kind: Action
name: booking_create
entity: booking
operation: create
derive:
  requested_at: booking_requested_now
---
kind: Action
name: book_resource
entity: booking
input:
  end_at: {required: true, type: datetime}
  requested_at: {required: true, type: datetime}
  resource_id: {required: true, type: relation}
  start_at: {required: true, type: datetime}
derive:
  requested_at: booking_requested_now
operation: transaction
steps:
  - op: assert_no_overlap
    values: {end: end_at, match: resource_id, message: The requested booking overlaps an existing booking., start: start_at}
  - op: create
    result: booking
    values: {end_at: $input.end_at, requested_at: $input.requested_at, resource_id: $input.resource_id, start_at: $input.start_at, status: confirmed}
  - job: booking_reminder
    op: schedule
    values: {id: $result.booking.id, status: cancelled}
---
kind: Action
name: cancel_booking
entity: booking
operation: transition
transitions:
  confirmed: [cancelled]
---
kind: Job
name: booking_reminder
action: cancel_booking
---
kind: TestSuite
name: book_resource_contract
target: {kind: Action, name: book_resource}
tests:
  - name: derives_time_and_creates_booking
    fixtures:
      resource:
        - {id: 00000000-0000-4000-8000-000000000301, name: Room A}
    context:
      actor: {id: 00000000-0000-4000-8000-000000000303, roles: [administrator]}
      time: "2026-09-01T10:00:00Z"
      requestId: booking-test
      ids: [00000000-0000-4000-8000-000000000302]
    input:
      resource_id: 00000000-0000-4000-8000-000000000301
      start_at: 2026-09-01T11:00:00Z
      end_at: 2026-09-01T12:00:00Z
    expect:
      result: {id: 00000000-0000-4000-8000-000000000302, requested_at: 2026-09-01T10:00:00Z, status: confirmed}
      changes:
        - {entity: booking, id: 00000000-0000-4000-8000-000000000302, values: {requested_at: 2026-09-01T10:00:00Z, status: confirmed}}
      noEvents: true
  - name: invalid_interval_rolls_back
    fixtures:
      resource:
        - {id: 00000000-0000-4000-8000-000000000301, name: Room A}
    context:
      actor: {id: 00000000-0000-4000-8000-000000000303, roles: [administrator]}
      time: "2026-09-01T10:00:00Z"
      requestId: booking-test
      ids: [00000000-0000-4000-8000-000000000302]
    input:
      resource_id: 00000000-0000-4000-8000-000000000301
      start_at: 2026-09-01T12:00:00Z
      end_at: 2026-09-01T11:00:00Z
    expect: {error: conflict, noChanges: true, noEvents: true}
